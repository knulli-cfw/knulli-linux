# Retro Pixel Pocket: no volume or brightness keys, two three-way rockers.
# Left rocker: up/down = BTN_TRIGGER_HAPPY5/6 -> brightness, press = TL2.
# Right rocker: up/down = BTN_TRIGGER_HAPPY7/8 (see the DTS) -> volume,
# press = TR2.
BTN_TRIGGER_HAPPY7 1            /usr/bin/volume-button volup
BTN_TRIGGER_HAPPY8 1            /usr/bin/volume-button voldown
BTN_TRIGGER_HAPPY7 0            /usr/bin/volume-button-release
BTN_TRIGGER_HAPPY8 0            /usr/bin/volume-button-release
BTN_TRIGGER_HAPPY5 1            /usr/bin/volume-button briup
BTN_TRIGGER_HAPPY6 1            /usr/bin/volume-button bridown
BTN_TRIGGER_HAPPY5 0            /usr/bin/volume-button-release
BTN_TRIGGER_HAPPY6 0            /usr/bin/volume-button-release
KEY_POWER       1               knulli-shutdown 1
KEY_POWER       0               knulli-shutdown 0
