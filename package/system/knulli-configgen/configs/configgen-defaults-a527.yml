default:
  options:
    gfxbackend: gl
    video_threaded: true
    # menu retroarch
    retroarch.menu_driver: ozone
    retroarch.menu_scale_factor: "1.500000"
    retroarch.audio_driver: alsathread
    retroarch.ozone_font_scale: "1"
    retroarch.ozone_font_scale_factor_global: "1.200000"
    retroarch.menu_battery_level_enable: "false"

nds:
  emulator: advanced_drastic
  core:     advanced_drastic
fmtowns:
  emulator: libretro
  core:     mame
