default:
  options:
    # menu retroarch
    retroarch.menu_driver: ozone
    retroarch.menu_scale_factor: "1.200000"
    retroarch.audio_driver: alsathread
    retroarch.ozone_font_scale: "1"
    retroarch.ozone_font_scale_factor_global: "1.200000"
    gfxbackend: vulkan

flash:
  emulator: lightspark
  core:     lightspark
fmtowns:
  emulator: libretro
  core:     mame
n64:
  emulator: libretro
  core:     mupen64plus-next
nds:
  emulator: libretro
  core:     melonds
cdi:
  emulator: libretro
  core:     same_cdi
