# UCM for the Unisoc UMS512 / T618 VBC + SC2730 codec card.
#
# PATH IS NOT ARBITRARY.  alsa-lib probes
# ucm2/conf.d/${CardDriver}/${CardLongName}.conf, and for this card those two
# differ: snd_card.driver is char[16], so ASoC truncates the 16-character card
# name to "sprdphone-sc273" (it logs "driver name too long" at probe), while
# longname keeps "sprdphone-sc2730".  Hence the mismatched directory and file
# names below -- they are correct, not a typo.

Syntax 4

SectionUseCase."HiFi" {
	File "/Unisoc/sprdphone-sc2730/HiFi.conf"
	Comment "Play HiFi quality music"
}

BootSequence [
	cset "name='HP mix mode' 0"
	cset "name='HPL EAR Sel' HPL"
	cset "name='DSP VBC Profile Select' 961216512"
	cset "name='VBC DAC0 DG Set' 63,63"
	cset "name='HPL Gain HPL Playback Volume' 8"
	cset "name='HPR Gain HPR Playback Volume' 8"
	cset "name='VBC_MIXER0_DAC0' HALF_ADD"
	cset "name='DAC LRCLK Select' invert"
	cset "name='agdsp_access_en' on"
	cset "name='S_NORMAL_AP01_P_CODEC SWITCH' on"
	cset "name='VBC_DAC0_DP_EN' enable"
	cset "name='HPL Mixer DACLHPL Switch' on"
	cset "name='HPR Mixer DACRHPR Switch' on"
	cset "name='Speaker Function' on"
	cset "name='Speaker1 Function' on"
]
