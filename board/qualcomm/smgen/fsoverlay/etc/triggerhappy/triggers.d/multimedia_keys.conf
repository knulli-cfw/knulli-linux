# sm8550 (Retroid Pocket Nova and siblings)
#
# The two volume keys sit on DIFFERENT input devices here:
#   KEY_VOLUMEUP   -> gpio-keys   (pm8550_gpios 6, from qcs8550-ayn-common.dtsi)
#   KEY_VOLUMEDOWN -> pmic_resin  (its own input device)
# triggerhappy watches all of /dev/input/event*, so that split does not matter to
# it, but it does mean anything reading a single device will only see half.
#
# KEY_POWER goes to power-button / power-button-release, which is what drives
# suspend.  Do NOT bind it straight to knulli-shutdown -- that skips suspend.
KEY_VOLUMEUP 1               /usr/bin/volume-button volup
KEY_VOLUMEDOWN 1             /usr/bin/volume-button voldown
KEY_VOLUMEUP 0               /usr/bin/volume-button-release
KEY_VOLUMEDOWN 0             /usr/bin/volume-button-release
KEY_VOLUMEUP+BTN_MODE 1      /usr/bin/volume-button briup
KEY_VOLUMEDOWN+BTN_MODE 1    /usr/bin/volume-button bridown
KEY_VOLUMEUP+BTN_MODE 0      /usr/bin/volume-button-release
KEY_VOLUMEDOWN+BTN_MODE 0    /usr/bin/volume-button-release
KEY_POWER 1                  /usr/bin/power-button
KEY_POWER 0                  /usr/bin/power-button-release
BTN_START+BTN_MODE 1         /usr/bin/knulli-softreset
