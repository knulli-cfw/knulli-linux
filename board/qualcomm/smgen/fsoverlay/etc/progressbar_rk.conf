# progressbar_rk arguments per device (sourced by rcS; MODEL is the DT model)
MODEL=$(tr -d '\0' < /sys/firmware/devicetree/base/model 2>/dev/null)
case "$MODEL" in
    "Retroid Pocket 5"*|"Retroid Pocket Flip2"*)
        PB_RK_ARGS="--logo /usr/share/knulli/splash/boot-logo-1080x1920-left.png" ;;
    "Anbernic RG 55G1") PB_RK_ARGS="--rotate 180" ;;   # verified on hardware
    "Retroid Pocket Classic"*) PB_RK_ARGS="--rotate 180" ;;   # verified on hardware
    *) PB_RK_ARGS="" ;;
esac
