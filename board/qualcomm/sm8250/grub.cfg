set default="0"
set timeout="5"

menuentry "Knulli - RP Mini" {
    linux /boot/Image label=KNULLI rootwait console=ttyMSM0,115200n8 clk_ignore_unused pd_ignore_unused
    initrd /boot/initrd.lz4
    devicetree /boot/sm8250-retroidpocket-rpmini.dtb
}

