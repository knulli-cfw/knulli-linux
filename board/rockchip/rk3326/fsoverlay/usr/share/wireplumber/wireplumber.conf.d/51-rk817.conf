# rk817 codec: WirePlumber's profile selection lands on "pro-audio" for this
# card and drives the stereo I2S link with 8-channel S32 frames, which the
# codec plays as silence (or noise).  Skip ACP profiles and pin the node to
# what the link is, as the a133/a527 overlays do for their codecs.
monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "alsa_card._sys_devices_platform_rk817-sound_sound_card0"
      }
    ]
    actions = {
      update-props = {
        api.alsa.use-acp = false
      }
    }
  }
  {
    matches = [
      {
        node.name = "~alsa_output._sys_devices_platform_rk817-sound_sound_card0.*"
      }
    ]
    actions = {
      update-props = {
        audio.channels = 2
        audio.rate = 48000
        # 32-bit frames come out as noise on the multicodecs boards
        # (XF40H/R36Max); 16-bit is what the rk817 link carries cleanly.
        audio.format = "S16LE"
        audio.position = [ FL FR ]
      }
    }
  }
]
