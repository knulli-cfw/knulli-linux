image boot.vfat {
        vfat {
                        extraargs = "-F 32 -n KNULLI"
                        @files
                }

                size = 5G
}

image userdata.ext4 {
        ext4 {
                label = "SHARE"
                use-mke2fs = "true"
                extraargs = "-m 0 -O ^metadata_csum"
        }
        size = "512M"
        # include files from TARGET_DIR/userdata
        mountpoint = "/userdata"
}

image knulli.img {
	hdimage {
		align = "1M"
		partition-table-type = "gpt"
		gpt-location = 81920
	}

	partition bootloader {
		in-partition-table = "no"
		image = "../../a133-boot-packages/boot0.img"
		offset = 131072
	}

	partition boot-package {
		in-partition-table = "no"
		image = "../../a133-boot-packages/a133_boot_package.fex"
		offset = 16793600
	}

	# kernel, initrd, DTBs and extlinux.conf live on the FAT partition;
	# U-Boot's environment is compiled in, so no boot/env partitions
	partition boot-resource {
		partition-type-uuid = "F"
		bootable = "true"
		image = "boot.vfat"
		offset = 37748736
	}

        partition userdata {
                partition-type-uuid = "L"
                image = "userdata.ext4"
        }

}
