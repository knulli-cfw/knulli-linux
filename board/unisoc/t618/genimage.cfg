image boot.vfat {
	vfat {
		extraargs = "-F 32 -n KNULLI"
		@files
	}
	size = 2G
}

image userdata.ext4 {
	ext4 {
		label = "SHARE"
		use-mke2fs = "true"
		extraargs = "-m 0"
	}
	size = "512M"
	mountpoint = "/userdata"
}

# The SPL loads U-Boot from the partition GPT-named "uboot", and the knulli
# initrd expects the boot filesystem to be partition 2, so the order here is
# fixed by the boot chain rather than by convention.
image knulli.img {
	hdimage {
		align = "1M"
		partition-table-type = "gpt"
	}

	partition uboot {
		partition-type-uuid = "L"
		image = "../../u-boot.img"
		size = 16M
	}

	partition KNULLI {
		partition-type-uuid = "F"
		image = "boot.vfat"
	}

	partition SHARE {
		partition-type-uuid = "L"
		image = "userdata.ext4"
	}
}
