# Board modules for T618 / UMS512.  S06modprobe runs one "modprobe" per line,
# in order -- so this file is the load ORDER, not just a list.

snd_seq

# GPU: Mali-G52 kbase, required by the g29p1 libmali blob (/dev/mali0).
# Loaded here rather than by udev; see modprobe.d/mali-gpu-noauto.conf.
mali_kbase

# Unisoc remoteproc cores -- must precede the WCN transport below.
sprd_pmsys
sprd_wcn

# Wi-Fi (pulls wcn_bsp + sc23xx_wlan; needs wcnmodem.bin + sprd/*.ini)
sc23xx_wlan_sdio

# Bluetooth (pulls hci_uart, btrtl, bluetooth, wcn_bsp)
btsprdsdio

# AGDSP audio (needs agdsp.bin)
sprd-audcp-boot
sprd-agdsp
