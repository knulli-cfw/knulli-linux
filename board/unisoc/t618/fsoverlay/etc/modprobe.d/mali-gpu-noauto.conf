# panfrost and mali_kbase BOTH match of:N*T*Carm,mali-bifrost, so whichever udev
# happens to probe first claims the GPU.  panfrost winning is fatal here: the
# g29p1 libmali blob talks to /dev/mali0, which only kbase creates, so the race
# decides whether there is any GL at all.
#
# Never let udev pick.  /etc/modules.conf loads mali_kbase explicitly, first.
blacklist panfrost
blacklist mali_kbase
