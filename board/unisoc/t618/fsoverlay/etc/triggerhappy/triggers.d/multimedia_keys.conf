# T618 / Anbernic RG Rotate.
#
# This file REPLACES the generic package/system/knulli-triggerhappy version at
# the same path, so the generic entries below are carried over verbatim --
# dropping them would take the power button and the ES hotkeys with them.

# Volume.  Routed through volume-button rather than calling knulli-audio
# directly: it adds hold-to-repeat (the "0" release lines clear the held flag)
# and it is what every other board uses.  volume-button calls
# "knulli-audio setSystemVolume +/-5".
KEY_VOLUMEUP 1               /usr/bin/volume-button volup
KEY_VOLUMEDOWN 1             /usr/bin/volume-button voldown
KEY_VOLUMEUP 0               /usr/bin/volume-button-release
KEY_VOLUMEDOWN 0             /usr/bin/volume-button-release

# Brightness: same two keys with BTN_MODE held ("knulli-brightness +/- 5").
KEY_VOLUMEUP+BTN_MODE 1      /usr/bin/volume-button briup
KEY_VOLUMEDOWN+BTN_MODE 1    /usr/bin/volume-button bridown
KEY_VOLUMEUP+BTN_MODE 0      /usr/bin/volume-button-release
KEY_VOLUMEDOWN+BTN_MODE 0    /usr/bin/volume-button-release

# --- carried over from the generic multimedia_keys.conf ---
KEY_POWER       1               knulli-shutdown 1
KEY_POWER       0               knulli-shutdown 0
# display some information on X displays
KEY_F2          1               /usr/bin/knulli-info --short | LANG=en_US HOME=/userdata/system XAUTHORITY=/var/lib/.Xauthority DISPLAY=:0.0 osd_cat -f -*-*-bold-*-*-*-38-120-*-*-*-*-*-* -cred -s 3 -d 4
KEY_F10+KEY_LEFTCTRL+KEY_LEFTALT 1 /etc/init.d/S31emulationstation stop
KEY_F11+KEY_LEFTCTRL+KEY_LEFTALT 1 chvt 1
KEY_LEFTMETA    1               knulli-brightness cycle
